automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Local checks before every commit: lake build with warnings as
        errors, an axiom sweep, leanchecker --fresh, a search for sorry,
        native_decide and axiom, a line-length check, and this catalogue's
        names; lake check --paranoid at milestones. CI is switched off.
  notes: >-
    Earlier sessions were run by Claude models as well; the commit history
    records each session.

fidelity:
  divergences: >-
    Fired ports stay behind as junctions of wires, and observational
    equivalence and compaction forget them. Rules are given for ordered
    pairs of symbols. Nets need not be finite.

review:
  status: "agent-reviewed"
  notes: >-
    Reviewed by Claude agents, a separate reviewer model at milestones,
    and audited by an agent once; not reviewed by a person. Claims once made and corrected
    are listed in the overview, section Corrections.

acknowledgements: "Lean 4 and its standard library, Lake, and the kernels of lake check."

# Schema: formalization.yaml v0.4 (github.com/mathlib-initiative/formalization.yaml).
# What is formalized here, from what, how, and how far it has been checked.
# The overview in InteractionNets.lean is the full account; this file is the
# catalogue. Every declaration named below is checked to exist by the local
# checks before each commit.
version: "v0.4"

project:
  name: "inets"
  description: >-
    Lafont's interaction nets in Lean 4 without Mathlib: nets with wires as
    chains of segments, firing, strong confluence and its consequences
    (confluence, unique normal forms, every reduction to a normal form of
    the same length), observational equivalence, renaming, and Lafont's
    symmetry condition. Then reducers proved to compute normal forms: a list
    reducer, a hash-map reducer linear in the steps, and machines with
    threads that claim active pairs, with bounds on their actions and their
    running time under stated cost models, including a program that walks
    the wires a rule joins, in O(n + K log K) on an indexed memory.
  authors: ["Claude (Anthropic models, through Claude Code)"]
  responsible_maintainers: ["OnixResearch"]
  license: "MPL-2.0"

sources:
  - title: "Interaction Nets"
    authors: ["Yves Lafont"]
    id: "doi:10.1145/96709.96718"
    type: "article"
    location: "POPL 1990, pages 95-108"
    relationship: "formalizes"
    note: >-
      The model and its strong confluence. Rules are given for ordered pairs
      of symbols as mirror images; Lafont's symmetry condition is shown to
      come to the same (Rhs.Lafont.presented).
    author_endorsement: "not-contacted"
  - title: "Interaction Combinators"
    authors: ["Yves Lafont"]
    id: "doi:10.1006/inco.1997.2643"
    type: "article"
    location: "Information and Computation 137(1), 1997, pages 69-101"
    relationship: "background"
    note: "The combinators are one of the example systems (Comb)."
    author_endorsement: "not-contacted"
  - title: "Reducers and machines with threads, and their bounds"
    type: "original-proof"
    relationship: "other"
    note: >-
      The machines with threads, the wire-walking program and its bounds
      are not taken from a source.

related_formalizations: []

